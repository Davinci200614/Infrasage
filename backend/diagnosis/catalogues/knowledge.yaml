schema_version: 1
catalogue_id: voting-app-bootstrap
version: 0.1.0
status: candidate_unreviewed
scope:
  application: docker-example-voting-app
  deployment: docker_compose
  single_primary_fault_assumption: true
  contexts:
  - vote
  - redis
  - worker
  - db
  - result
  - host
notes:
- Root causes are candidates, not alert names.
- Qualitative support/contradiction is not a Bayesian likelihood.
- Multiple simultaneous faults and unknown causes require abstention or a richer model.
- The selected metrics are candidates based on open-source documentation and topology, not a verified live Netdata
  inventory.
sources:
  voting_app: https://github.com/dockersamples/example-voting-app
  netdata: https://learn.netdata.cloud/docs/live-view
  prometheus_alerts: https://github.com/samber/awesome-prometheus-alerts
  prometheus_rules: https://github.com/samber/awesome-prometheus-alerts/blob/master/_data/rules.yml
hypotheses:
  redis_process_stopped:
    component: redis
    description: Redis container or service stopped
    category: docker_runtime
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  redis_service_degraded:
    component: redis
    description: Redis running but degraded/unresponsive
    category: service_health
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  worker_process_stopped:
    component: worker
    description: Vote worker process/container stopped
    category: docker_runtime
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  postgres_process_stopped:
    component: db
    description: PostgreSQL container or service stopped
    category: docker_runtime
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  postgres_connection_saturation:
    component: db
    description: Database connections exhausted or heavily saturated
    category: database
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  worker_redis_network_failure:
    component: network
    description: Worker cannot reach Redis despite Redis running
    category: network
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  worker_postgres_network_failure:
    component: network
    description: Worker cannot reach PostgreSQL despite DB running
    category: network
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  worker_redis_endpoint_wrong:
    component: configuration
    description: Worker configured with incorrect Redis endpoint
    category: configuration
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  worker_postgres_endpoint_wrong:
    component: configuration
    description: Worker configured with incorrect DB endpoint
    category: configuration
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  host_cpu_saturation:
    component: host
    description: Host CPU contention significantly affects services
    category: host_resource
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  host_memory_pressure:
    component: host
    description: Host memory exhaustion/pressure affects services
    category: host_resource
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  host_disk_pressure:
    component: host
    description: Host disk capacity or I/O pressure affects services
    category: host_resource
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  vote_frontend_unavailable:
    component: vote
    description: Vote frontend unavailable independent of downstream services
    category: frontend
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  result_frontend_unavailable:
    component: result
    description: Result frontend unavailable independent of downstream services
    category: frontend
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - voting_app_topology
    - netdata_observability_patterns
    - prometheus_alert_taxonomy
  other_unknown:
    component: other
    description: Unmodeled, multiple or otherwise unknown cause
    category: open_world
    environments:
    - docker_compose
    review_status: proposed_unvalidated
    source_basis:
    - open_world_modeling_assumption
relationships:
- test_id: redis_runtime_state
  hypothesis_outcomes:
    redis_process_stopped:
      supports: stopped
      contradicts: running
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: redis_service_health
  hypothesis_outcomes:
    redis_process_stopped:
      supports: unreachable
      contradicts: healthy
    redis_service_degraded:
      supports: degraded
      contradicts: healthy
    host_cpu_saturation:
      supports: degraded
      contradicts: healthy
    host_memory_pressure:
      supports: degraded
      contradicts: healthy
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: worker_runtime_state
  hypothesis_outcomes:
    worker_process_stopped:
      supports: stopped
      contradicts: running
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: postgres_runtime_state
  hypothesis_outcomes:
    postgres_process_stopped:
      supports: stopped
      contradicts: running
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: postgres_service_health
  hypothesis_outcomes:
    postgres_process_stopped:
