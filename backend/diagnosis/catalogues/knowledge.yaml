  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: host_cpu_pressure
  hypothesis_outcomes:
    host_cpu_saturation:
      supports: critical
      contradicts: normal
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: host_memory_pressure
  hypothesis_outcomes:
    host_memory_pressure:
      supports: critical
      contradicts: normal
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: host_disk_pressure
  hypothesis_outcomes:
