      contradicts: healthy
    postgres_connection_saturation:
      supports: degraded
      contradicts: healthy
    host_cpu_saturation:
      supports: degraded
      contradicts: healthy
    host_memory_pressure:
      supports: degraded
      contradicts: healthy
    host_disk_pressure:
      supports: degraded
      contradicts: healthy
