- test_id: result_http_check
  hypothesis_outcomes:
    postgres_process_stopped:
      supports: error
      contradicts: healthy
    host_cpu_saturation:
      supports: error
      contradicts: healthy
    result_frontend_unavailable:
      supports: unreachable
      contradicts: healthy
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: vote_to_redis_connectivity
  hypothesis_outcomes:
