      contradicts: none
    redis_service_degraded:
      supports: redis_error
      contradicts: none
    postgres_process_stopped:
      supports: postgres_error
      contradicts: none
    postgres_connection_saturation:
      supports: postgres_error
      contradicts: none
    worker_redis_network_failure:
      supports: redis_error
      contradicts: none
    worker_postgres_network_failure:
      supports: postgres_error
      contradicts: none
    worker_redis_endpoint_wrong:
      supports: redis_error
      contradicts: none
    worker_postgres_endpoint_wrong:
      supports: postgres_error
      contradicts: none
  review_status: proposed_unvalidated
  basis: causal engineering assumption; verify by controlled fault injection
- test_id: postgres_connection_saturation
  hypothesis_outcomes:
    postgres_connection_saturation:
      supports: exhausted
      contradicts: normal
    host_disk_pressure:
      supports: high
      contradicts: normal
  review_status: proposed_unvalidated
