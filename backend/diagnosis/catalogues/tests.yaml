schema_version: 1
catalogue_id: voting-app-bootstrap-tests
version: 0.1.0
live_execution_policy: deny_until_bound_and_verified
assumption_policy: All tests are modelable; Netdata capabilities are assumed only for simulation; do not execute
  unspecified endpoints.
tests:
  redis_runtime_state:
    description: Docker container/process state, via verified Netdata capability or Docker fallback
    component: redis
    target_selector:
      application: voting-app
      component: redis
    provider: netdata
    execution:
      mode: snapshot_or_function
      logical_operation: container_process_state
      live_binding: null
      binding_status: verified
      requires_configuration: true
    outcomes:
    - running
    - stopped
    - restarting
    normal_outcome: running
    availability:
      simulation: true
      live: false
      reason: Provider capability/binding not validated against installed agent or collector
    freshness_max_seconds: null
    synthetic_cost_for_planner_simulation:
      energy_j: 0.1
      latency_ms: 120
      status: illustrative_unmeasured
    source_basis:
    - netdata_agent
    - voting_app_topology
    evidence_group: redis_state
    review_status: proposed_unvalidated
